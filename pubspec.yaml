name: apna_clinic
description: "Apna Clinic - Production Offline-First Clinic Management Web Application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.13.2 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & Architecture
  flutter_riverpod: ^2.6.1

  # Navigation & Routing
  go_router: ^14.8.1

  # Data Modeling & Serialization
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Offline Database (Drift + Web IndexedDB / SQLite Wasm)
  drift: ^2.24.2
  drift_flutter: ^0.2.4

  # Utility, Security & Formats
  uuid: ^4.5.1
  crypto: ^3.0.6
  intl: ^0.20.2
  shared_preferences: ^2.3.5

  # Printing & PDF Generation
  pdf: ^3.11.2
  printing: ^5.13.3

  # Cloud & HTTP
  http: ^1.3.0
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12
  url_launcher: ^6.3.2

  # UI & Typography
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  encrypt: ^5.0.3
  file_picker: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  freezed: ^2.5.8
  json_serializable: ^6.9.4
  drift_dev: ^2.24.2

flutter:
  uses-material-design: true
  generate: true
  assets:
    - .env.example
    - .env
